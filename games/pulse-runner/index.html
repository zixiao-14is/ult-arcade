<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pulse Runner</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; user-select: none; background: #000; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="engine.js"></script>
<script src="game.js"></script>
<script>
  // Esc on the menu: hand control back to the terminal, or reopen the menu when played on its own.
  function exit() {
    if (window.parent !== window) window.parent.postMessage('exit-game', '*');
    else PulseRunner.open(exit);
  }
  PulseRunner.open(exit);
</script>
</body>
</html>

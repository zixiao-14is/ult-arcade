<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pulse Terminal</title>
<!-- lets a phone add the games to its home screen and open them full screen, like an app -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ULT Arcade">
<meta name="theme-color" content="#0b0b1a">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #e6e6e6; overflow: hidden; }
  body { font: 15px/1.45 Consolas, "Cascadia Mono", Menlo, "DejaVu Sans Mono", monospace; }
  #term { height: 100%; overflow-y: auto; padding: 14px 16px; box-sizing: border-box; cursor: text; }
  .line { white-space: pre-wrap; word-break: break-word; min-height: 1.45em; }
  .dim { color: #7a7a7a; } .ok { color: #9fe89f; } .err { color: #ff7b7b; } .hl { color: #fff; font-weight: bold; } .acc { color: #7fd7ff; }
  #prompt { display: flex; }
  #ps { color: #9fe89f; white-space: pre; }
  #typed { white-space: pre-wrap; word-break: break-all; }
  .cur { background: #fff; color: #000; }
  .cur.blink { animation: blink 1.06s steps(1) infinite; }
  @keyframes blink { 50% { background: transparent; color: inherit; } }
  #hidden { position: absolute; left: -9999px; opacity: 0; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #000; }
</style>
<!-- iPad/iPhone: holding a finger down must never select the page (the blue highlight) or open the copy menu.
     Safari only obeys the -webkit- versions of these. Text boxes stay selectable so typing still works. -->
<style>
  * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  input, textarea { -webkit-user-select: text; user-select: text; }
</style>
<script>
  (function () {
    const inTextBox = e => { const el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement; return !!(el && el.closest && el.closest('input, textarea')); };
    document.addEventListener('selectstart', e => { if (!inTextBox(e)) e.preventDefault(); });
    document.addEventListener('contextmenu', e => { if (!inTextBox(e)) e.preventDefault(); });
    // games draw on a canvas and read pointer events, which still arrive; this only stops Safari's own hold and zoom gestures
    document.addEventListener('touchstart', e => { if (e.target.tagName === 'CANVAS') e.preventDefault(); }, { passive: false });
  })();
</script>
</head>
<body>
<div id="term"><div id="out"></div><div id="prompt"><span id="ps">user@pulse:~$ </span><span id="typed"></span></div></div>
<input id="hidden" autocomplete="off" autocapitalize="off" spellcheck="false">
<iframe id="game" title="game" allow="autoplay; fullscreen"></iframe>

<script src="launcher.js"></script>
<script>
// Add new games here: id is what /game-run --<id> uses, file is the game's page inside games/.
const GAMES = [
  { id: 'pulserunner', alias: ['pulse-runner', 'pulse'], name: 'Pulse Runner', file: 'games/pulse-runner/index.html',
    tags: 'rhythm runner platformer music jump',
    desc: 'Rhythm auto-runner. Tap to jump over spikes, fly the ship, flip gravity. 6 levels + practice mode.' },
  { id: 'snake', alias: ['snek', 'classic-snake'], name: 'Snake', file: 'games/snake/index.html',
    tags: 'classic arcade snake retro leaderboard',
    desc: 'Classic snake. Eat apples, grow longer, don\'t bite yourself. Local top-10 leaderboard.' },
  { id: 'tictactoe', alias: ['tic-tac-toe', 'ttt', 'xo'], name: 'Tic-Tac-Toe', file: 'games/tic-tac-toe/index.html',
    tags: 'classic board strategy 2-player bot minimax',
    desc: 'Classic 3x3. Play a friend on one keyboard, or a perfect minimax bot.' },
  { id: 'connect4', alias: ['connect-4', 'connect-four', 'connectfour', 'c4'], name: 'Connect 4', file: 'games/connect-four/index.html',
    tags: 'classic board strategy 2-player',
    desc: 'Classic 7x6. Drop discs, get four in a row. 2 players on one keyboard.' },
  { id: 'onlyup', alias: ['only-up', 'up'], name: 'Only Up', file: 'games/only-up/index.html',
    tags: 'climbing platformer retro hard rage jump',
    desc: 'Climb the tower. No checkpoints, about 30 minutes, one slip and you fall.' },
  { id: 'pebble', alias: ['pebble-solitaire', 'peg-solitaire', 'solitaire'], name: 'Pebble Solitaire', file: 'games/pebble-solitaire/index.html',
    tags: 'classic board puzzle solitaire peg single-player',
    desc: 'Classic 33-hole cross board. Jump pebbles to remove them and leave just one.' },
];

// Games run full screen in an iframe. A game sends postMessage('exit-game') to come back here.
const frame = document.getElementById('game');
let onGameClosed = null;
function openGame(g, done) {
  onGameClosed = done;
  frame.src = g.file;
  frame.style.display = 'block';
  frame.onload = () => { try { frame.contentWindow.focus(); } catch {} };
  frame.focus();
}
function closeGame() {
  if (!onGameClosed) return;
  frame.style.display = 'none';
  frame.onload = null;
  frame.src = 'about:blank';   // unload it so its music and timers stop
  try { window.AndroidVolumeKeys && AndroidVolumeKeys.setActive(false); } catch {}   // Android app: volume buttons back to volume
  const cb = onGameClosed; onGameClosed = null; cb();
}
addEventListener('message', e => { if (e.data === 'exit-game' && e.source === frame.contentWindow) closeGame(); });

const out = document.getElementById('out');
const typedEl = document.getElementById('typed');
const input = document.getElementById('hidden');
const term = document.getElementById('term');
let buf = '', pos = 0, history = [], hIdx = 0;

function print(text = '', cls = '') {
  const d = document.createElement('div');
  d.className = 'line ' + cls;
  d.textContent = text;
  out.appendChild(d);
  term.scrollTop = term.scrollHeight;
}
function render() {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const ch = buf[pos] ?? ' ';
  typedEl.innerHTML = esc(buf.slice(0, pos)) + '<span class="cur blink">' + esc(ch) + '</span>' + esc(buf.slice(pos + 1));
  term.scrollTop = term.scrollHeight;
}
function findGame(id) {
  id = id.toLowerCase().replace(/^-+/, '');
  return GAMES.find(g => g.id === id || g.alias.includes(id));
}
function listGames(list) {
  print('  ID              NAME             DESCRIPTION', 'dim');
  for (const g of list) print('  ' + g.id.padEnd(16) + g.name.padEnd(17) + g.desc);
  print(`  ${list.length} game(s)`, 'dim');
}

const COMMANDS = {
  help() {
    print('Commands:', 'hl');
    print('  /game-library --all         list every game');
    print('  /game-library <search>      search names + descriptions');
    print('  /game-run --<id>            launch a game (Esc in game = back)');
    print('  /clear                      clear the screen');
    print('  /help                       this help');
  },
  clear() { out.innerHTML = ''; },
  'game-library'(args) {
    const q = args.join(' ').trim().toLowerCase();
    if (!q) return print('usage: /game-library --all | /game-library <search>', 'err');
    if (q === '--all' || q === '-- all' || q === 'all') return listGames(GAMES);
    const needle = q.replace(/^--\s*/, '');
    const hits = GAMES.filter(g => [g.id, g.name, g.desc, g.tags, ...g.alias].join(' ').toLowerCase().includes(needle));
    if (!hits.length) return print(`no games match "${needle}"`, 'err');
    listGames(hits);
  },
  'game-run'(args) {
    const raw = args.join('').trim();
    if (!raw) return print('usage: /game-run --<id>   (see /game-library --all)', 'err');
    const g = findGame(raw);
    if (!g) return print(`game "${raw.replace(/^-+/, '')}" not found`, 'err');
    print(`launching ${g.name}...`, 'ok');
    input.blur();
    term.style.display = 'none';
    // launch after this Enter keypress finishes, so the game's menu doesn't also see it
    setTimeout(() => openGame(g, () => {
      term.style.display = '';
      print('game closed.', 'dim');
      input.focus();
    }));
  },
};
COMMANDS['game-libary'] = COMMANDS['game-library'];

function run(line) {
  print('user@pulse:~$ ' + line, 'acc');
  const t = line.trim();
  if (!t) return;
  if (!t.startsWith('/')) return print(`'${t}' is not a command. Commands start with /  (try /help)`, 'err');
  const [cmd, ...args] = t.slice(1).split(/\s+/);
  const fn = COMMANDS[cmd.toLowerCase()];
  if (!fn) return print(`unknown command: /${cmd}  (try /help)`, 'err');
  fn(args);
}

// The hidden input holds the text; we just mirror it with a block cursor.
function setLine(text) { input.value = text; input.setSelectionRange(text.length, text.length); sync(); }
function sync() { buf = input.value; pos = input.selectionStart ?? buf.length; render(); }
input.addEventListener('input', sync);
input.addEventListener('keyup', sync);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const line = input.value;
    if (line.trim()) history.push(line);
    hIdx = history.length;
    setLine('');
    run(line);
  } else if (e.key === 'ArrowUp') { e.preventDefault(); if (hIdx > 0) setLine(history[--hIdx]); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); hIdx = Math.min(history.length, hIdx + 1); setLine(history[hIdx] ?? ''); }
  else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); out.innerHTML = ''; }
  else setTimeout(sync);
});
document.addEventListener('selectionchange', () => { if (document.activeElement === input) sync(); });
term.addEventListener('click', () => input.focus());

// Phones get a tap-to-play launcher instead of the terminal (add ?phone to the address to try it on a computer).
const PHONE = /[?&]phone\b/.test(location.search) || !!window.Capacitor ||
  (matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 820);
// Offline support for the home-screen version. Not for file:// (not allowed) or the Android app (already offline).
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !window.Capacitor) navigator.serviceWorker.register('sw.js').catch(() => {});

if (PHONE) {
  document.title = 'ULT Arcade';
  term.style.display = 'none';
  PhoneLauncher.start({ games: GAMES, open: openGame, close: closeGame, frame });
} else {
  input.focus();
  print('PULSE TERMINAL v1.1', 'hl');
  print('type /help for commands', 'dim');
  print('');
  render();
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ULT Arcade</title>
<!-- lets a phone add the games to its home screen and open them full screen, like an app -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ULT Arcade">
<meta name="theme-color" content="#0b0b1a">
<style>
  html, body { margin: 0; height: 100%; background: #0b0b1a; overflow: hidden; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #000; }
</style>
<!-- iPad/iPhone: holding a finger down must never select the page (the blue highlight) or open the copy menu.
     Safari only obeys the -webkit- versions of these. Text boxes stay selectable so typing still works. -->
<style>
  * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  input, textarea { -webkit-user-select: text; user-select: text; }
</style>
<script>
  (function () {
    const inTextBox = e => { const el = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement; return !!(el && el.closest && el.closest('input, textarea')); };
    document.addEventListener('selectstart', e => { if (!inTextBox(e)) e.preventDefault(); });
    document.addEventListener('contextmenu', e => { if (!inTextBox(e)) e.preventDefault(); });
    // games draw on a canvas and read pointer events, which still arrive; this only stops Safari's own hold and zoom gestures
    document.addEventListener('touchstart', e => { if (e.target.tagName === 'CANVAS') e.preventDefault(); }, { passive: false });
  })();
</script>
</head>
<body>
<iframe id="game" title="game" allow="autoplay; fullscreen"></iframe>

<script src="launcher.js"></script>
<script src="visitor.js"></script>
<script>
// The games, in the order the arcade shows them. file is the game's page inside games/;
// id picks the card's picture and colour in launcher.js (CARDS).
const GAMES = [
  { id: 'pulserunner', name: 'Pulse Runner', file: 'games/pulse-runner/index.html',
    desc: 'Rhythm auto-runner. Jump spikes, fly, flip gravity. 7 levels; the last, Asian Mode, is 17 minutes and only a bot can beat it.' },
  { id: 'snake', name: 'Snake', file: 'games/snake/index.html',
    desc: 'Classic snake with a local top-10 leaderboard.' },
  { id: 'tictactoe', name: 'Tic-Tac-Toe', file: 'games/tic-tac-toe/index.html',
    desc: 'Classic 3x3. Play a friend, or a perfect minimax bot.' },
  { id: 'connect4', name: 'Connect 4', file: 'games/connect-four/index.html',
    desc: 'Classic 7x6. Drop discs, get four in a row. 2 players.' },
  { id: 'onlyup', name: 'Only Up', file: 'games/only-up/index.html',
    desc: 'Climb the tower. No checkpoints, about 30 minutes.' },
  { id: 'pebble', name: 'Pebble Solitaire', file: 'games/pebble-solitaire/index.html',
    desc: 'Classic 33-hole cross board. Jump pebbles until one is left.' },
];

// Games run full screen in an iframe. A game sends postMessage('exit-game') to come back to the arcade.
const frame = document.getElementById('game');
let onGameClosed = null;
function openGame(g, done) {
  onGameClosed = done;
  Visitor.opened(g.id);
  frame.src = g.file;
  frame.style.display = 'block';
  frame.onload = () => { try { frame.contentWindow.focus(); } catch {} };
  frame.focus();
}
function closeGame() {
  if (!onGameClosed) return;
  frame.style.display = 'none';
  frame.onload = null;
  frame.src = 'about:blank';   // unload it so its music and timers stop
  try { window.AndroidVolumeKeys && AndroidVolumeKeys.setActive(false); } catch {}   // Android app: volume buttons back to volume
  Visitor.closed();
  const cb = onGameClosed; onGameClosed = null; cb();
}
addEventListener('message', e => { if (e.data === 'exit-game' && e.source === frame.contentWindow) closeGame(); });

// Offline support for the home-screen version. Not for file:// (not allowed) or the Android app (already offline).
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !window.Capacitor) navigator.serviceWorker.register('sw.js').catch(() => {});

ArcadeLauncher.start({ games: GAMES, open: openGame, close: closeGame, frame });
Visitor.start();   // visitor number in the corner, stats for the admin page
</script>
</body>
</html>
